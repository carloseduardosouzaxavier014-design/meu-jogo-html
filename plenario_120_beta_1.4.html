<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plenário 120 - Tribunal</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14122b;--paper:#fff7da;--blue:#1e6bff;--red:#ff2e4d;--yellow:#ffd400;--green:#22d65f;--purple:#7b3cff;--orange:#ff7a1a;
  --tit:Bangers,Impact,"Arial Black",sans-serif;
  --so:-3px -3px 0 #14122b,3px -3px 0 #14122b,-3px 3px 0 #14122b,3px 3px 0 #14122b,0 5px 0 #14122b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fe3ff;font-family:Fredoka,"Baloo 2","Comic Sans MS",system-ui,sans-serif;font-weight:600;color:var(--ink)}
canvas{display:block}
.dot{width:16px;height:16px;border-radius:50%;flex:none}

/* ===== Painéis e botões estilo HQ ===== */
.panel{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:8px 12px}
button{font-family:var(--tit);font-size:20px;letter-spacing:1.5px;padding:9px 20px;border:4px solid var(--ink);border-radius:14px;background:var(--yellow);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .1s}
button:hover:not(:disabled){transform:translateY(-2px) rotate(-1deg)}
button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:disabled{background:#c9c6d9;color:#7b7894;cursor:not-allowed;box-shadow:0 3px 0 #6d6a87}
.protest{background:var(--red)!important;color:#fff!important;text-shadow:2px 2px 0 var(--ink)}
#mute{position:fixed;top:10px;right:10px;z-index:30;width:52px;height:52px;padding:0;border-radius:50%;font-size:26px;line-height:1;background:var(--yellow)}

/* ===== Topo: placar + controles ===== */
#ui{position:fixed;top:0;left:0;right:0;padding:10px 70px 10px 10px;display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;justify-content:center;pointer-events:none}
#ui>*{pointer-events:auto}
#score{display:flex;gap:10px;flex-wrap:wrap;background:var(--yellow)}
.pl{--c:#999;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:14px;border:3px solid var(--ink);background:#fff;min-width:130px;position:relative;transition:transform .2s,background .2s}
.pl .dot{width:40px;height:40px;border:3px solid var(--ink);background-color:var(--c);background-size:cover;background-position:center}
.pl b{display:block;font-size:12px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl span{font-family:var(--tit);font-size:25px;letter-spacing:1px}
.pl small{font-size:11px}
.pl.active{background:var(--c);transform:translateY(-3px) rotate(-2deg) scale(1.06);box-shadow:0 5px 0 var(--ink)}
.pl.active b,.pl.active span,.pl.active small{color:#fff;text-shadow:-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),1px 1px 0 var(--ink)}
.pl.active::after{content:'SUA VEZ!';position:absolute;top:-15px;right:-8px;background:var(--red);color:#fff;font-family:var(--tit);font-size:13px;letter-spacing:1px;padding:1px 8px;border:2px solid var(--ink);border-radius:8px;transform:rotate(6deg)}
#ctrl{display:flex;align-items:center;gap:14px;background:var(--blue);color:#fff}
#dieval{font-family:var(--tit);font-size:24px;letter-spacing:1px;min-width:130px;text-shadow:var(--so)}
#hint{font-size:13px;font-weight:700;margin-top:4px;max-width:270px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:2px 8px}
#hint:empty{display:none}
#roll{background:var(--red);color:#fff;font-size:26px;padding:10px 22px;text-shadow:2px 2px 0 var(--ink);animation:pulse 1s ease-in-out infinite}
#roll:disabled{animation:none;text-shadow:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07) rotate(-1deg)}}

/* ===== Balão de fala (mensagens) ===== */
#msg{position:fixed;left:18px;bottom:34px;max-width:calc(100vw - 350px);font-size:17px;min-height:24px;z-index:5;border-radius:24px;background:#fff;padding:10px 18px}
#msg::before{content:'';position:absolute;left:34px;bottom:-24px;border:14px solid transparent;border-top:20px solid var(--ink);border-bottom:0}
#msg::after{content:'';position:absolute;left:37px;bottom:-15px;border:11px solid transparent;border-top:16px solid #fff;border-bottom:0}

/* ===== Jogador da vez ===== */
#tcard{position:fixed;right:14px;bottom:14px;display:flex;align-items:center;gap:12px;border:5px solid #ff2e4d;transition:border-color .3s;z-index:5;transform:rotate(1.5deg)}
#tcard small{display:block;opacity:.7;font-size:12px}
#tcard b{font-family:var(--tit);font-size:22px;letter-spacing:1px}
#tname{word-break:break-word;max-width:200px;display:block}
#avatar{width:84px;height:84px;border:4px solid var(--ink);border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 4px currentColor;flex:none}
#avatar img,#avatar svg{width:100%;height:100%;object-fit:cover;display:block}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.7) rotate(-8deg)}60%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(1.5deg)}}

/* ===== Inventário ===== */
#inv{position:fixed;right:14px;bottom:140px;z-index:5;padding:8px 10px;max-width:calc(100vw - 24px);background:var(--yellow)}
#inv h4{margin:0 0 6px;font-family:var(--tit);font-size:17px;letter-spacing:1.5px;display:flex;justify-content:space-between;gap:12px;cursor:pointer;user-select:none;font-weight:400}
#invT{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#inv.min #invSlots{display:none}
#inv.min h4{margin-bottom:0}
#invSlots{display:flex;gap:6px}
.slot{--ic:#fff;width:76px;min-height:96px;border-radius:12px;border:3px solid var(--ink);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 3px;text-align:center}
.slot.vazio{border-style:dashed;opacity:.55;justify-content:center;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.slot.cheio{background:var(--ic);box-shadow:0 4px 0 var(--ink)}
.slot .sic{font-size:28px;line-height:1.1}
.slot .nm{font-size:10px;line-height:1.1;color:#fff;min-height:22px;display:flex;align-items:center;justify-content:center;text-shadow:-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink),1px 1px 0 var(--ink)}
.slot button{padding:2px 6px;font-size:14px;width:100%;letter-spacing:.5px;border-radius:8px;border-width:3px;box-shadow:0 3px 0 var(--ink)}

/* ===== Modais (setup / fim / itens / cartas) ===== */
#setup,#modal,#im,#carta{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:repeating-conic-gradient(rgba(255,212,0,.2) 0 5deg,rgba(20,18,43,.82) 5deg 10deg)}
#setup{display:flex;z-index:20;background:repeating-conic-gradient(rgba(30,107,255,.5) 0 5deg,rgba(123,60,255,.7) 5deg 10deg)}
#modal{z-index:10}#carta{z-index:12}#im{z-index:14}
#setup .box,#modal .box,#im .box,#carta .cv{background:radial-gradient(rgba(20,18,43,.09) 1.6px,transparent 1.8px) 0 0/10px 10px,var(--paper);border:6px solid var(--ink);border-radius:26px;box-shadow:0 10px 0 var(--ink);text-align:center;color:var(--ink);max-height:92vh;overflow:auto;animation:slam .5s cubic-bezier(.2,1.3,.4,1)}
#setup .box{width:min(94vw,460px);padding:22px 26px}
#modal .box{padding:26px 34px;min-width:300px}
#im .box{width:min(470px,94vw);padding:22px 26px}
#carta .cv{width:min(450px,94vw);padding:22px 26px}
@keyframes slam{0%{transform:scale(2.4) rotate(-12deg);opacity:0}55%{transform:scale(.92) rotate(2deg);opacity:1}80%{transform:scale(1.04) rotate(-1deg)}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
#setup h2{margin:0 0 4px;font-family:var(--tit);font-weight:400;font-size:54px;letter-spacing:3px;color:var(--yellow);text-shadow:var(--so);transform:rotate(-3deg)}
#setup p{margin:6px 0 14px;font-size:14px}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;text-align:left}
.row .dot{width:32px;height:32px;border:3px solid var(--ink)}
.row .f{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.row b{font-family:var(--tit);font-weight:400;font-size:17px;letter-spacing:1px}
.row input{flex:1;min-width:0;padding:8px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);font:inherit}
.row input:focus{outline:0;box-shadow:0 0 0 3px var(--yellow)}
.av{display:flex;gap:6px;align-items:center}
.av input:not([type=file]){flex:1;font-size:12px;padding:6px 8px}
.row input[type=file]{flex:none;width:46%;padding:4px;border:3px dashed var(--ink);background:#fff3b0;font-size:11px}
.th{width:40px;height:40px;border-radius:10px;border:3px solid var(--ink);object-fit:cover;display:none}
.modot{font-family:var(--tit);font-size:20px;letter-spacing:1.5px;margin-top:8px;text-align:left}
.modo{display:flex;gap:10px;margin-top:6px;text-align:left}
.modo label{flex:1;display:flex;align-items:center;gap:8px;border:4px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff;cursor:pointer;font-size:15px;line-height:1.15;box-shadow:0 4px 0 var(--ink);transition:transform .15s}
.modo label small{font-size:12px;font-weight:600;opacity:.75}
.modo label:has(input:checked){background:var(--yellow);transform:rotate(-1.5deg) translateY(-2px)}
.modo input{accent-color:var(--red);width:18px;height:18px;margin:0;flex:none}
#setup button{margin-top:14px;width:100%;font-size:26px;background:var(--red);color:#fff;text-shadow:2px 2px 0 var(--ink)}
#modal h2{margin:0 0 6px;font-family:var(--tit);font-weight:400;font-size:38px;letter-spacing:2px;color:var(--yellow);text-shadow:var(--so)}
#rank{list-style:none;padding:0;margin:16px 0}
#rank li{padding:6px 12px;margin:6px 0;border-radius:12px;background:#fff;border:3px solid var(--ink);display:flex;gap:10px;align-items:center;font-size:17px}
#rank li .dot{width:22px;height:22px;border:2px solid var(--ink)}
#rank li span:last-child{margin-left:auto;font-family:var(--tit);font-size:22px}
#modal .box button+button{margin-left:8px;margin-top:6px;background:var(--blue);color:#fff;text-shadow:2px 2px 0 var(--ink)}

#im .sel,#carta .sel{display:inline-block;background:var(--yellow);border:3px solid var(--ink);padding:3px 16px;border-radius:10px;font-family:var(--tit);font-size:19px;letter-spacing:2px;transform:rotate(-3deg);box-shadow:0 4px 0 var(--ink)}
#im .bic,#carta .ic{font-size:56px;margin:8px 0 2px;line-height:1.2;animation:bob 1.1s ease-in-out infinite}
#im h3,#carta h3{margin:4px 0 12px;font-family:var(--tit);font-weight:400;font-size:34px;letter-spacing:1.5px;line-height:1.1;color:#fff;text-shadow:var(--so)}
#im .tx,#carta .tx{font-size:16px;line-height:1.45;text-align:left;white-space:pre-line;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:12px 16px;margin:0 0 14px;box-shadow:0 4px 0 var(--ink)}
#carta .li{font-size:14px;margin:0 0 12px;background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:6px 10px;transform:rotate(-1deg)}
#carta .pt{font-family:var(--tit);font-size:56px;letter-spacing:2px;margin:4px 0 12px;text-shadow:var(--so)}
#carta.verde .cv{background:radial-gradient(rgba(20,18,43,.1) 1.6px,transparent 1.8px) 0 0/10px 10px,#c9ffd9}
#carta.vermelho .cv{background:radial-gradient(rgba(20,18,43,.1) 1.6px,transparent 1.8px) 0 0/10px 10px,#ffd0d8}
#carta.verde .sel{background:var(--green)}
#carta.vermelho .sel{background:var(--red);color:#fff}
#carta.verde .pt{color:#6bff9a}#carta.vermelho .pt{color:#ff6b83}
#im .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#im .opts button{flex:1 1 150px;font-size:17px;padding:8px 12px;line-height:1.1}
#im .opts button small{display:block;font-family:Fredoka,sans-serif;font-size:11px;opacity:.85;letter-spacing:0;margin-top:3px}
#im .opts button.sec{background:#b9b6d6}

/* ===== Camada de efeitos (VFX) ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fxflash{position:absolute;inset:0;background:#fff;opacity:0;animation:fxflash .38s ease-out}
@keyframes fxflash{0%{opacity:.9}100%{opacity:0}}
.fxlines{position:absolute;left:50%;top:50%;width:300vmax;height:300vmax;margin:-150vmax 0 0 -150vmax;background:repeating-conic-gradient(var(--lc,#fff) 0 2.2deg,transparent 2.2deg 7deg);-webkit-mask-image:radial-gradient(circle,transparent 9%,#000 24%);mask-image:radial-gradient(circle,transparent 9%,#000 24%);opacity:0;animation:fxlines .8s ease-out}
@keyframes fxlines{0%{opacity:0;transform:scale(.6)}20%{opacity:.85}100%{opacity:0;transform:scale(1.15) rotate(8deg)}}
.fxtxt{position:absolute;left:50%;top:42%;font-family:var(--tit);font-size:clamp(54px,15vw,170px);letter-spacing:4px;line-height:1;color:var(--c,#fff);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink);white-space:nowrap;animation:fxtxt 1.1s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes fxtxt{0%{transform:translate(-50%,-50%) scale(3.2) rotate(-14deg);opacity:0}22%{transform:translate(-50%,-50%) scale(.9) rotate(-6deg);opacity:1}38%{transform:translate(-50%,-50%) scale(1.1) rotate(-6deg)}50%{transform:translate(-50%,-50%) scale(1) rotate(-6deg)}82%{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}100%{transform:translate(-50%,-85%) scale(1.05) rotate(-6deg);opacity:0}}
.fxstar{position:absolute;font-weight:700;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;pointer-events:none}
.fxfloat{position:absolute;font-family:var(--tit);font-size:46px;letter-spacing:2px;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);white-space:nowrap}

@media(max-width:600px){
  #ui{padding-right:64px}
  #tcard b{font-size:16px}#avatar{width:52px;height:52px}
  #msg{bottom:96px!important;max-width:calc(100vw - 28px)!important;font-size:15px}
  #inv{bottom:170px;right:8px;padding:6px 8px}
  .slot{width:calc((100vw - 62px)/4);max-width:76px;min-height:88px}#invT{max-width:150px}
  #setup h2{font-size:42px}
}
@media(prefers-reduced-motion:reduce){#roll,#im .bic,#carta .ic{animation:none}}
</style>
</head>
<body>
<div id="fx"></div>
<button id="mute" title="Som ligado/desligado (tecla M)" aria-label="Ligar ou desligar o som">🔊</button>
<div id="ui">
  <div class="panel" id="score"></div>
  <div class="panel" id="ctrl">
    <div><div id="dieval">Veredito: —</div><div id="hint"></div></div>
    <button id="roll">Rolar Dado</button>
  </div>
</div>
<div id="msg" class="panel">Bem-vindo! Jogador Vermelho começa.</div>
<div id="tcard" class="panel">
  <div id="avatar" style="color:#ff2e4d"><img id="avimg" alt="" style="display:none">
    <svg id="avsvg" viewBox="0 0 64 64"><rect width="64" height="64" fill="currentColor" opacity=".55"/><path d="M4 64Q8 44 32 42Q56 44 60 64Z" fill="#1e6bff" stroke="#14122b" stroke-width="2.5"/><path d="M26 43L32 56L38 43Z" fill="#fff" stroke="#14122b" stroke-width="2"/><path d="M30 47h4l1.5 11-3.5 3-3.5-3z" fill="#ff2e4d" stroke="#14122b" stroke-width="1.5"/><circle cx="32" cy="27" r="13" fill="#ffd2a8" stroke="#14122b" stroke-width="2.5"/><path d="M18 26Q17 9 33 10Q48 10 46 26Q41 17 32 18Q24 18 18 26Z" fill="#2a1a12" stroke="#14122b" stroke-width="2"/><circle cx="27" cy="28" r="3.2" fill="#fff" stroke="#14122b" stroke-width="1.5"/><circle cx="37" cy="28" r="3.2" fill="#fff" stroke="#14122b" stroke-width="1.5"/><circle cx="27.8" cy="28.5" r="1.4" fill="#14122b"/><circle cx="37.8" cy="28.5" r="1.4" fill="#14122b"/><path d="M26 34Q32 40 38 34" fill="#fff" stroke="#14122b" stroke-width="2" stroke-linecap="round"/></svg></div>
  <div><small>Na tribuna</small><b id="tname">Sua Vez: Jogador Vermelho</b></div>
</div>
<div class="panel" id="inv">
  <h4 id="invH" title="Clique para recolher/expandir"><span id="invT">🎒 INVENTÁRIO</span><span id="invN">0/4</span></h4>
  <div id="invSlots"></div>
</div>
<div id="im"><div class="box">
  <div class="sel" id="imSel"></div><div class="bic" id="imIc"></div>
  <h3 id="imTit"></h3><div class="tx" id="imTx"></div>
  <div class="opts" id="imOpts"></div>
</div></div>
<div id="setup"><div class="box">
  <h2>⚖️ Plenário 120</h2><p>Convoque os 4 jogadores: nome e retrato (opcionais). Em branco = nome padrão.</p>
  <div id="rows"></div>
  <div class="modot">Modo de partida</div>
  <div class="modo">
    <label><input type="radio" name="modo" value="120" checked><span>🏛️ Normal<br><small>120 casas</small></span></label>
    <label><input type="radio" name="modo" value="60"><span>⚡ Rápido<br><small>60 casas</small></span></label>
  </div>
  <button id="start">Iniciar Sessão!</button>
</div></div>
<div id="carta"><div class="cv">
  <div class="sel" id="cSelo"></div><div class="ic" id="cIc"></div>
  <h3 id="cTit"></h3><div class="tx" id="cTx"></div><div class="li" id="cLi"></div>
  <div class="pt" id="cPt"></div>
  <button id="cOk">Compreender Impacto</button>
</div></div>
<div id="modal"><div class="box">
  <h2 id="winner"></h2><div>Placar do Julgamento</div>
  <ul id="rank"></ul>
  <button id="again">Nova Sessão (mesmos nomes)</button><button id="rename" class="protest">Protesto! Novo cadastro</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js" onerror="void 0"></script>
<script>
const SP = 2.2;
let FIM = 120, COLS = 11, ROWS = 11;   // alterados pelo modo de partida (120 ou 60 casas)
const MODOS = {120:{fim:120, cols:11}, 60:{fim:60, cols:8}};
function aplicarModo(m) {const c = MODOS[m] || MODOS[120]; FIM = c.fim; COLS = c.cols; ROWS = Math.ceil((FIM + 1)/COLS);}
const PLAYERS = [
  {nome:'Vermelho', cor:0xff2e4d, css:'#ff2e4d'},
  {nome:'Verde',    cor:0x22d65f, css:'#22d65f'},
  {nome:'Azul',     cor:0x1e6bff, css:'#1e6bff'},
  {nome:'Amarelo',  cor:0xffd400, css:'#ffd400'}
];
const HAIRS = [0x2a1a12, 0xd9822b, 0x1b1b1b, 0x8b4a1f];
const OFF = [[-.45,-.45],[.45,-.45],[-.45,.45],[.45,.45]];
const INK = 0x14122b;

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const REDUZ = matchMedia('(prefers-reduced-motion: reduce)').matches;

// =====================================================================
//  ÁUDIO: trilha chiptune em loop + efeitos (Web Audio, tudo sintetizado)
//  Melodia original, no estilo enérgico/dramático de jogos de tribunal.
// =====================================================================
const AUD = (() => {
  let ctx = null, master, mus, sfxG, noiseBuf, step = 0, next = 0, muted = false;
  try { muted = localStorage.getItem('p120mute') === '1'; } catch (e) {}
  const BPM = 152, ST = 60 / BPM / 4;
  const fr = m => 440 * Math.pow(2, (m - 69) / 12);
  // 8 compassos: Dm | Bb | C | A  ||  Gm | Dm | Bb | A
  const CH   = [[62,65,69,74],[58,62,65,70],[60,64,67,72],[57,61,64,69],[55,58,62,67],[62,65,69,74],[58,62,65,70],[57,61,64,69]];
  const ROOT = [38,34,36,33,31,38,34,33];
  const LEAD = [ // por compasso: [passo(0-15), nota MIDI, duração em passos]
    [[0,74,2],[2,77,2],[4,76,1],[5,74,1],[6,72,2],[8,74,4],[12,69,2],[14,72,2]],
    [[0,70,2],[2,74,2],[4,72,1],[5,70,1],[6,69,2],[8,70,4],[12,65,2],[14,69,2]],
    [[0,72,2],[2,76,2],[4,74,1],[5,72,1],[6,67,2],[8,72,4],[12,67,2],[14,71,2]],
    [[0,73,2],[2,76,2],[4,73,2],[6,69,2],[8,73,3],[11,76,1],[12,77,2],[14,76,2]],

  const leadAt = {};

    (function f(now) {
      const t = Math.min(1, (now - t0)/d), arc = Math.sin(Math.PI*t);
      mesh.position.lerpVectors(from, to, t);
      mesh.position.y += arc*h;

      mesh.rotation.z = lado*amp*Math.sin(Math.PI*t);
      mesh.rotation.x = .3*Math.sin(2*Math.PI*t);
      mesh.rotation.y = lado*.5*Math.sin(Math.PI*t) + (t < .5 ? 0 : -lado*.25*Math.sin(2*Math.PI*(t - .5)));

// ---------- Desmaio (casa vermelha): tomba girando, fica tonto no chão e se levanta cambaleando ----------
const bounceOut = t => {const n = 7.5625, d = 2.75;
  if (t < 1/d) return n*t*t; if (t < 2/d) return n*(t -= 1.5/d)*t + .75;
  if (t < 2.5/d) return n*(t -= 2.25/d)*t + .9375; return n*(t -= 2.625/d)*t + .984375;};
function cair(mesh, k) {
  return new Promise(res => {
    mesh.userData.spring = null; AUD.desmaio();
    const ch = mesh.children[1], dir = k % 2 ? 1 : -1, t0 = performance.now(), d = 650;
    mesh.userData.dir = dir; mesh.scale.set(1, 1, 1);
    (function f(now) {
      const t = Math.min(1, (now - t0)/d), e = bounceOut(t);
      ch.rotation.z = dir*Math.PI/2*e;
      ch.rotation.y = (1 - t)*Math.PI*4*dir;            // rodopia antes de cair
      ch.position.set(dir*.5*e, .1 + .26*e + Math.sin(Math.PI*t)*.5*(1 - t), 0);
      mesh.scale.set(1 + .25*e, 1 - .1*e, 1 + .25*e);
      if (t < 1) return requestAnimationFrame(f);
      ch.rotation.y = 0; mesh.scale.set(1, 1, 1);
      burst3D(mesh.position.clone().setY(.4), 0xffffff, 8, 2.5); fxShake(5, 250);
      // estrelinhas de tontura girando sobre a cabeça enquanto estiver no chão
      clearInterval(mesh.userData.tonto);
      mesh.userData.tonto = setInterval(() => {
        burst3D(mesh.position.clone().add(new THREE.Vector3(-dir*.5, 1.25, 0)), 0xffd400, 3, 1.4);
      }, 260);
      const sp = toScreen(mesh.position.clone().add(new THREE.Vector3(-dir*.5, 1.6, 0)));
      fxFloat('💫', '#ffd400', sp.x, sp.y);
      res();
    })(t0);
  });
}
function levantar(mesh) {
  return new Promise(res => {
    clearInterval(mesh.userData.tonto);
    const ch = mesh.children[1], dir = mesh.userData.dir || 1, t0 = performance.now(), d = 800; AUD.pulo();
    (function f(now) {

      ch.rotation.z = dir*Math.PI/2*(1 - e) + Math.sin(t*Math.PI*4)*.22*(1 - t);   // cambaleia ao levantar
      ch.position.set(dir*.5*(1 - e), .1 + .26*(1 - e), 0);
      const up = Math.sin(Math.PI*t)*.15;
      mesh.scale.set(1 - up*.5, 1 + up, 1 - up*.5);
      if (t < 1) return requestAnimationFrame(f);
      ch.rotation.set(0, 0, 0); ch.position.set(0, .1, 0);
      mesh.scale.set(1, 1, 1); mesh.userData.spring = performance.now(); AUD.pouso();
      burst3D(mesh.position.clone().setY(.4), 0xffffff, 5, 2); res();

}
// voo do Foguete de Campanha: um arco enorme até a casa de destino
function voar(mesh, from, to) {
  return new Promise(res => {

    (function f(now) {

      mesh.position.lerpVectors(from, to, te);
      mesh.position.y += arc*9;

// ---------- Dado 3D ----------
function faceTex(n) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#14122b'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#fff8e1'; g.beginPath(); g.roundRect ? g.roundRect(8, 8, 112, 112, 22) : g.rect(8, 8, 112, 112); g.fill();
  const P = {1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],
             5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]]};
  g.fillStyle = ['#ff2e4d','#1e6bff','#22b957','#ff7a1a','#7b3cff','#ff2e4d'][n - 1];
  P[n].forEach(([x, y]) => {g.beginPath(); g.arc(32+x*32, 32+y*32, n === 1 ? 17 : 11, 0, 7); g.fill();});
  return new THREE.CanvasTexture(cv);
}
// ordem das faces do BoxGeometry: +x,-x,+y,-y,+z,-z (opostas somam 7)
const die = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5),
  [3,4,1,6,2,5].map(n => new THREE.MeshToonMaterial({map:faceTex(n), gradientMap:gradTex})));
die.castShadow = true; die.visible = false; die.position.set(0, 0.85, 0); ol(die, 1.07); scene.add(die);
const die2 = new THREE.Mesh(die.geometry, die.material); // segundo dado (item Dado Duplo)
die2.castShadow = true; die2.visible = false; die2.position.set(0, 0.85, 0); ol(die2, 1.07); scene.add(die2);
const FACE_EULER = {1:[0,0,0], 6:[Math.PI,0,0], 3:[0,0,Math.PI/2], 4:[0,0,-Math.PI/2], 2:[-Math.PI/2,0,0], 5:[Math.PI/2,0,0]};
function popScale(mesh, ms = 240) {
  return new Promise(res => {
    const t0 = performance.now();
    (function f(now) {
      const t = Math.min(1, (now - t0)/ms);
      mesh.scale.setScalar(1 + .3*Math.sin(Math.PI*t));
      if (t < 1) requestAnimationFrame(f); else {mesh.scale.setScalar(1); res();}
    })(t0);
  });
}
// queda de grande altura, quiques sucessivos e giro rápido que desacelera
function rolarDado(v, mesh = die, ox = 0, texto = true) {
  return new Promise(res => {
    const V = THREE.Vector3, Q = THREE.Quaternion;
    const fin = new Q().setFromAxisAngle(new V(0,1,0), Math.random()*6.28)
      .multiply(new Q().setFromEuler(new THREE.Euler(...FACE_EULER[v])));
    const a1 = new V(Math.random()-.5, 1, Math.random()-.5).normalize();
    const a2 = new V(1, Math.random()-.5, Math.random()-.5).normalize();
    const x0 = ox ? ox + (Math.random()-.5)*.8 : (Math.random()-.5)*4, z0 = (Math.random()-.5)*(ox ? 2 : 4);
    mesh.scale.setScalar(1); mesh.visible = true;
    const t0 = performance.now(), d = 2000, H = 8.5, BN = 3.5; let lastB = 0;
    (function f(now) {
      const t = Math.min(1, (now - t0)/d), e = (1-t)*(1-t), h = Math.abs(Math.cos(t*Math.PI*BN));
      mesh.position.set(x0*t, .85 + H*h*e, z0*t);
      mesh.quaternion.copy(new Q().setFromAxisAngle(a1, e*10*Math.PI))
        .multiply(new Q().setFromAxisAngle(a2, e*7*Math.PI)).multiply(fin);
      const b = Math.floor(t*BN + .5);
      if (b > lastB && t < 1) {lastB = b; AUD.clack(); burst3D(new THREE.Vector3(mesh.position.x, .3, mesh.position.z), 0xffd400, 6, 2.5);}
      if (t < 1) requestAnimationFrame(f);
      else {
        AUD.clack(); burst3D(new THREE.Vector3(mesh.position.x, .3, mesh.position.z), 0xffffff, 8, 3);
        popScale(mesh).then(() => {if (texto) $('dieval').textContent = 'Veredito: ' + v; res();});
      }
    })(t0);
  });
}

      opts:[{label:'🚀 Lançar!', val:1}, {label:'Cancelar', cls:'sec', val:0}]});
    if (r === 1) {

      await voar(pw.mesh, pawnPos(de, k), pawnPos(para, k));   // voo em arco até a casa de destino
      pw.pos = para; renderScore(); tileDip(para);
      AUD.boom(); fxShake(12, 500); crowdBoost = 1;
      burst3D(pawnPos(para, k).setY(.6), 0xff7a1a, 24, 5); burst3D(pawnPos(para, k).setY(.6), 0xffd400, 14, 4);
      atingidos.forEach(i => {pawns[i].pts -= FOG_PTS; pontosFx(i, `−${FOG_PTS}`, false);});
      if (atingidos.length) AUD.perde();
      renderScore();
      const det = atingidos.length
        ? atingidos.map(i => `${PLAYERS[i].nome} perdeu ${FOG_PTS} pontos de reputação.`).join('\n')
        : 'Nenhum rival foi atingido.';
      msg(atingidos.length ? `🚀 O foguete atingiu ${atingidos.map(i => PLAYERS[i].nome).join(', ')}!` : `🚀 ${PLAYERS[k].nome} avançou sem atingir ninguém.`);
      await sleep(600);
      await imShow({selo:'🚀 CAMPANHA DECOLOU', ic:'🚀', tit:'Foguete lançado!',
        tx:`${PLAYERS[k].nome} avançou ${para - de} casa(s) (casa ${de} → ${para}).\n${det}`,
        opts:[{label:'Continuar', val:0}]});
      if (pw.pos >= FIM) {
        fim = true; msg(`${PLAYERS[k].nome} chegou ao Veredito Final de foguete! Sessão encerrada!`);
        renderScore(); return mostrarFim();
      }
    }
    ocupado = false; $('roll').disabled = false; renderScore();
  }
}

async function jogar(duplo = false) {
  if (ocupado || fim) return;
  ocupado = true; $('roll').disabled = true; renderInv();
  const v1 = 1 + Math.floor(Math.random()*6), v2 = duplo ? 1 + Math.floor(Math.random()*6) : 0, v = v1 + v2;
  const pl = PLAYERS[turno], pw = pawns[turno];
  $('dieval').textContent = 'Rolando...'; $('hint').textContent = '';
  if (duplo) {AUD.duplo(); await fxTexto('DADO DUPLO!', '#b36bff', {ms:700});}
  AUD.dado(); fxLinhas('#ffd400');
  if (duplo) {
    await Promise.all([rolarDado(v1, die, -1.6, false), rolarDado(v2, die2, 1.6, false)]);
    $('dieval').textContent = `Veredito: ${v1} + ${v2} = ${v}`;
  } else await rolarDado(v1);
  const sp = toScreen(die.position);
  AUD.veredito(); fxFloat(`${v}!`, '#ffd400', sp.x, sp.y - 20); fxStars(sp.x, sp.y, 10);
  const alvo = Math.min(FIM, pw.pos + v);
  mostrarDica(alvo);
  msg(duplo ? `🎲 Dado Duplo! ${v1} + ${v2} = ${v}. ${pl.nome} apresenta uma prova e avança ${alvo - pw.pos} casa(s).`
            : `Veredito do Dado: ${v}! ${pl.nome} apresenta uma prova e avança ${alvo - pw.pos} casa(s).`);
  await sleep(1100);
  die.visible = false; die2.visible = false;
  while (pw.pos < alvo) {
    const from = pawnPos(pw.pos, turno), to = pawnPos(pw.pos + 1, turno);
    await hop(pw.mesh, from, to); pw.pos++; renderScore();
  }
  tileDip(pw.pos);
  if (pw.pos >= FIM) { fim = true; msg(`${pl.nome} chegou ao Veredito Final! Sessão encerrada!`); renderScore(); return mostrarFim(); }
  const t = tiles[pw.pos];
  const pp = pawnPos(pw.pos, turno).setY(.5);
  if (t.tipo === 'verde' || t.tipo === 'vermelho') {
    const verde = t.tipo === 'verde';
    burst3D(pp, verde ? 0x22d65f : 0xff2e4d, 12, 4);
    msg(verde ? `Procede! ${pl.nome} recebeu uma carta de Boa Conduta.` : `OBJEÇÃO! ${pl.nome} recebeu uma carta de Má Conduta.`);
    verde ? AUD.prova() : AUD.objecao();
    await fxTexto(verde ? 'PROVA!' : 'OBJEÇÃO!', verde ? '#22d65f' : '#ff2e4d',
      {ms:850, shake:!verde, lc:verde ? '#ffd400' : '#fff', fc:verde ? '#fff' : '#ffd0d8'});
    if (!verde) {await cair(pw.mesh, turno); await sleep(450);}   // desmaia na casa vermelha
    await mostrarCarta(sortearCarta(t.tipo, pl.nome, t.valor));
    pw.pts += t.valor; renderScore();
    pontosFx(turno, (verde ? '+' : '−') + Math.abs(t.valor), verde);
    if (verde) AUD.ganha(); else {AUD.perde(); fxShake(6, 300);}
    msg(verde ? `${pl.nome} ganhou ${t.valor} pontos!` : `${pl.nome} perdeu ${-t.valor} pontos! Desmaiou de vergonha...`);
    if (verde) await sleep(600);
    else {await sleep(1500); await levantar(pw.mesh); await sleep(250);}   // fica caído um momento e se levanta
  }
  else {
    burst3D(pp, 0xffffff, 6, 3);
    const rnd = Math.random();
    if (t.tipo === 'branco' && rnd < CHANCE_ITEM) await receberItem(turno, sortearItem());
    else if (t.tipo === 'branco' && rnd < CHANCE_ITEM + CHANCE_MINI) await miniCarta(turno);
    else msg(`Sem objeções: nada acontece com ${pl.nome}.`);
  }
  turno = (turno + 1) % 4; renderScore();
  ocupado = false; $('roll').disabled = false; renderInv();
}

const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, clock.getDelta()), now = performance.now(), tt = now/1000;
  updateCam();
  // partículas 3D
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.life >= p.max) {scene.remove(p.m); parts.splice(i, 1); continue;}
    p.v.y -= 10*dt; p.m.position.addScaledVector(p.v, dt);
    p.m.scale.setScalar(Math.max(.01, 1 - p.life/p.max)); p.m.rotation.x += dt*8; p.m.rotation.y += dt*6;
  }
  // mola dos peões (squash & stretch ao pousar) e "afundar" das casas
  pawns.forEach(p => {
    const sp = p.mesh.userData.spring; if (!sp) return;
    const d = (now - sp)/1000;
    if (d > .55) {p.mesh.scale.set(1, 1, 1); p.mesh.userData.spring = null; return;}
    const s = Math.exp(-8*d)*Math.cos(26*d);
    p.mesh.scale.set(1 + .18*s, 1 - .3*s, 1 + .18*s);
  });
  tileObjs.forEach(g => {
    const dp = g.userData.dip; if (!dp) return;
    const d = (now - dp)/1000;
    if (d > .5) {g.position.y = 0; g.userData.dip = null; return;}
    g.position.y = -.18*Math.exp(-9*d)*Math.cos(22*d);
  });
  // plateia e juiz
  crowdBoost *= Math.exp(-dt*1.5);
  crowd.forEach(c => {c.g.position.y = c.y + Math.abs(Math.sin(tt*3 + c.ph))*(.1 + crowdBoost*.8);});
  juiz.rotation.z = Math.sin(tt*2)*.05;
  renderer.render(scene, camera);
})();
</script>
